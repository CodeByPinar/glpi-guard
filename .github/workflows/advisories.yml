name: Update advisory database

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Fetch GitHub Security Advisories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php tools/fetch-advisories.php
      - name: Tests still pass
        run: php tests/run.php
      - name: Open pull request (reviewed by a human before merge)
        uses: peter-evans/create-pull-request@v7
        with:
          branch: advisories/update
          commit-message: 'data: update advisory database'
          title: 'Update advisory database'
          body: 'Automatic refresh of data/advisories.json from GitHub Security Advisories.'
          add-paths: data/advisories.json
