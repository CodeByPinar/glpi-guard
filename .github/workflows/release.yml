name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          ini-values: phar.readonly=0
          coverage: none
      - run: php tests/run.php
      - run: php tools/build-phar.php && php tools/build-plugin.php
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/glpi-guard.phar
            dist/glpi-guard.phar.sha256
            dist/glpiguard*.tar.gz
            dist/glpiguard*.tar.gz.sha256
          generate_release_notes: true
