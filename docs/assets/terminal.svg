<text x="26" y="213" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#334155" xml:space="preserve">──────────────────────────────────────────────────────────────────────────────</text>
<text x="26" y="234" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#F43F5E" font-weight="700">[Critical]</tspan><tspan fill="#F8FAFC" font-weight="600"> Default account "glpi" is active with its default password</tspan><tspan fill="#475569">  GG-B01</tspan></text>
<text x="26" y="255" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#CBD5E1" xml:space="preserve">    "glpi" is a super-admin account. Anyone who knows the public default</text>
<text x="26" y="276" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#CBD5E1" xml:space="preserve">    password can take over the whole GLPI.</text>
<text x="26" y="297" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#64748B" xml:space="preserve">    • glpi (password = default, verified locally)</text>
<text x="26" y="318" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#6EE7B7" xml:space="preserve">    → Administration &gt; Users &gt; glpi: change the password, or disable/delete</text>
<text x="26" y="339" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#6EE7B7" xml:space="preserve">    the account if it is not needed.</text>
<text x="26" y="360" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#CBD5E1" xml:space="preserve"></text>
<text x="26" y="381" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FB923C" font-weight="700">[High]</tspan><tspan fill="#F8FAFC" font-weight="600"> GLPI 11.0.8 is affected by 21 published security advisories</tspan><tspan fill="#475569">  GG-A01</tspan></text>
<text x="26" y="402" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#CBD5E1" xml:space="preserve">    Severity breakdown: 17 high, 4 medium. These vulnerabilities are public;</text>
<text x="26" y="423" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#CBD5E1" xml:space="preserve">    several GLPI flaws (SQL injection, remote code execution) have been</text>
<text x="26" y="444" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#CBD5E1" xml:space="preserve">    exploited in the wild.</text>
<text x="26" y="465" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#64748B" xml:space="preserve">    • [HIGH] GHSA-47mc-679g-2jrv — Reflected XSS in the dashboard search result widget</text>
<text x="26" y="486" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#64748B" xml:space="preserve">    • [HIGH] GHSA-c46f-4v9j-5gpc — Privilege escalation via user cloning</text>
<text x="26" y="507" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#64748B" xml:space="preserve">    • [HIGH] GHSA-5pgp-cfq7-4j9h — Improper rights checks in users deletion</text>
<text x="26" y="528" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#64748B" xml:space="preserve">    • [HIGH] GHSA-pjj6-ww22-86qh — SQL Injection through form actors dropdown</text>
<text x="26" y="549" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#64748B" xml:space="preserve">    • [HIGH] GHSA-mhhg-77qx-qf26 / CVE-2026-57151 — 2FA deactivation/modification on users with higher privileges</text>
<text x="26" y="570" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#64748B" xml:space="preserve">    • [HIGH] GHSA-3w48-r8r5-mf8c / CVE-2026-57150 — Authorization bypass in massive actions</text>
<text x="26" y="591" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#64748B" xml:space="preserve">    • [HIGH] GHSA-7x93-gxc8-jp8m — Stored XSS via asset name</text>
<text x="26" y="612" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#64748B" xml:space="preserve">    • [HIGH] GHSA-hv93-qr6v-7mpj — Race condition in marketplace allowing malicious plugin installation</text>
<text x="26" y="633" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#6EE7B7" xml:space="preserve">    → Upgrade GLPI to 11.0.10 or later (latest release of your branch</text>
<text x="26" y="654" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#6EE7B7" xml:space="preserve">    recommended). Back up files and database first, then follow the official</text>
<text x="26" y="675" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#6EE7B7" xml:space="preserve">    upgrade procedure (php bin/console db:update).</text>
<text x="26" y="696" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" font-weight="400" fill="#CBD5E1" xml:space="preserve"></text>
<text x="26" y="717" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#FB923C" font-weight="700">[High]</tspan><tspan fill="#F8FAFC" font-weight="600"> Default account "tech" is active with its default password</tspan><tspan fill="#475569">  GG-B01</tspan></text>
